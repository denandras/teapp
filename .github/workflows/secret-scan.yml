# Scans commits for Discord webhook URLs and blocks PRs that contain them.
name: Secret Scan

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  discord-webhook-check:
    name: Block Discord webhook URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for Discord webhook URLs
        run: |
          echo "Scanning all files for Discord webhook URLs..."
          MATCHES=$(grep -rnE 'https://discord\.com/api/webhooks/[0-9]+/[A-Za-z0-9_-]+' . \
            --exclude-dir=.git \
            --exclude='.github/workflows/secret-scan.yml' \
            || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Discord webhook URL found in repo! Remove it and use the placeholder instead."
            echo "$MATCHES"
            exit 1
          fi
          echo "No Discord webhook URLs found."

      - name: Scan for other common secrets
        run: |
          echo "Scanning for other exposed secrets..."
          # Supabase anon/service keys
          MATCHES=$(grep -rnE 'eyJ[A-Za-z0-9_-]{20,}' . \
            --exclude-dir=.git \
            || true)
          if [ -n "$MATCHES" ]; then
            echo "::warning::Possible JWT token found — verify this is safe to commit."
            echo "$MATCHES"
          fi
          echo "Secret scan complete."